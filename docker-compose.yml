services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the explicit env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the explicit env file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the explicit env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in the explicit env file}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the explicit env file}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in the explicit env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the explicit env file}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in the explicit env file}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PORT: 3000
    ports:
      - '${API_PORT:-3001}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        ./node_modules/.bin/prisma migrate deploy
        if [ -n "$${ADMIN_EMAIL:-}" ] && [ -n "$${ADMIN_PASSWORD:-}" ]; then
          node dist/prisma/seed.js
        elif [ -n "$${ADMIN_EMAIL:-}" ] || [ -n "$${ADMIN_PASSWORD:-}" ]; then
          echo "ADMIN_EMAIL and ADMIN_PASSWORD must be provided together" >&2
          exit 1
        fi
        exec node dist/src/main.js
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: on-failure

volumes:
  postgres_data:
